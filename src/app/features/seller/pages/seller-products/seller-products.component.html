<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>My Products</h2>

    <button class="btn btn-success" (click)="openForm()">Add New Product</button>
  </div>

  <table class="table table-bordered table-hover">
    <thead class="thead-light">
      <tr>
        <th>ID</th>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Brand</th>
        <th>Category</th>
        <th>Stock Quantity</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>
          <img [src]="'assets/images/' + product.imageUrl" alt="{{product.imageUrl}}" width="75px">
        </td>
        <td>{{ product.name }}</td>
        <td>{{ product.price | currency:'TRY'}}</td>
        <td>{{ product.brand }}</td>
        <td>{{ product.category }}</td>
        <td>
          <div class="d-flex align-items-center justify-content-center" style="height: 100%;">
            <button class="btn btn-sm btn-danger"
                    (click)="decreaseStockQuantity(product)">-</button>
            <button class="btn btn-sm btn-success ms-1"
                    (click)="increaseStockQuantity(product)">+</button>

            <div class="input-group input-group-sm ms-1" style="width: 100px;">
              <input type="number" min="0" class="form-control text-center"
                    [(ngModel)]="stockInputs[product.id]">
              <button class="btn btn-primary ms-1" (click)="updateStockQuantity(product)">✔</button>
            </div>
          </div>
        </td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="editProduct(product)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteProduct(product.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <nav aria-label="Page navigation">
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="pageNumber === 0">
            <button class="page-link" (click)="prevPage()">Prev</button>
          </li>
          <li class="page-item">
            <span class="page-link">Page {{ pageNumber + 1 }}</span>
          </li>
          <li class="page-item" [class.disabled]="products.length < (pageNumber + 1) * pageSize">
            <button class="page-link" (click)="nextPage()">Next</button>
          </li>
        </ul>
      </nav>
</div>

<app-seller-product-form *ngIf="showForm"
                  [product]="selectedProduct"
                  (close)="onFormClose($event)">
</app-seller-product-form>
