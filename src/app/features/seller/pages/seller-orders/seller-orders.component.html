<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>My Orders</h2>


    <select class="form-select w-auto" [(ngModel)]="statusFilter" (change)="onStatusFilterChange(statusFilter)">
      <option value="">All</option>
      <option value="PENDING">Pending</option>
      <option value="CONFIRMED">Confirmed</option>
      <option value="PARTIALLY_SHIPPED">Partially Shipped</option>
      <option value="SHIPPED">Shipped</option>
      <option value="PARTIALLY_DELIVERED">Partially Delivered</option>
      <option value="DELIVERED">Delivered</option>
      <option value="PARTIALLY_RETURN_REQUESTED">Partially Return Requested</option>
      <option value="PARTIALLY_REFUNDED">Partially Refunded</option>
      <option value="RETURN_REQUESTED">Return Requested</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
  </div>


  <table class="table table-bordered table-hover">
    <thead class="thead-light">
      <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Products</th>
        <th>Total Amount</th>
        <th>Status</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.user?.username }}</td>
        <td>
          <ul class="list-unstyled mb-0">
            <li *ngFor="let item of order.orderItems">
              {{ item.product.name }} x {{ item.quantity }}
            </li>
          </ul>
        </td>
        <td>{{ order.totalAmount| currency:'TRY' }}</td>
        <td>{{ order.status }}</td>
        <td>{{ order.createdAt | date:'short' }}</td>
        <td>

          <button class="btn btn-sm btn-primary me-1" (click)="viewOrder(order.id)">View</button>
          <button class="btn btn-sm btn-success" (click)="markShipped(order.id)" *ngIf="order.status === 'CONFIRMED'">Mark Shipped</button>
        </td>
      </tr>
    </tbody>
  </table>


  <nav aria-label="Page navigation">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="pageNumber === 0">
        <button class="page-link" (click)="prevPage()">Prev</button>
      </li>
      <li class="page-item">
        <span class="page-link">Page {{ pageNumber + 1 }}</span>
      </li>
      <li class="page-item" [class.disabled]="(pageNumber + 1) * pageSize >= totalElements">
        <button class="page-link" (click)="nextPage()">Next</button>
      </li>
    </ul>
  </nav>
</div>
