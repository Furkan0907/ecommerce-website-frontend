<div class="container mt-4" *ngIf="!loading; else loadingTemplate">
  <h2>Order #{{ orderId }} Details</h2>

  <button class="btn btn-primary my-2" (click)="goBack()">Go Back</button>

  <div *ngIf="orderItems.length > 0; else noItemsTemplate">
    <ul class="list-group mb-3">
      <li class="list-group-item" *ngFor="let item of orderItems">
        <div class="d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center">
            <img [src]="'assets/images/' + item.product.imageUrl" alt="{{ item.product.name }}" width="50" class="me-2">
            <div>
              <div (click)="viewProduct(item.product.id)" style="cursor: pointer; font-weight: 500;">
                {{ item.product.name }}
              </div>
              <small>Quantity: {{ item.quantity }}</small>
            </div>
          </div>
          <div class="text-end">
            <div>{{ item.price | currency:'TRY' }}</div>
            <button class="btn btn-success btn-sm mt-1"
                    (click)="markShipped(item.id)"
                    [disabled]="item.status !== 'CONFIRMED'">
              Mark Shipped
            </button>
          </div>
        </div>
      </li>
    </ul>

    <div class="text-end fw-bold">
      Total Amount (your products): {{ sellerTotalAmount | currency:'TRY' }}
    </div>
  </div>

</div>

<ng-template #loadingTemplate>
  <p>Loading order details...</p>
</ng-template>

<ng-template #noItemsTemplate>
  <p>No order items found for your products in this order.</p>
</ng-template>
