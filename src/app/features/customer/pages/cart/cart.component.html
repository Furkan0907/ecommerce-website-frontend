<div class="container my-4">
  <h2 class="mb-4">Your Cart</h2>

  <div class="alert alert-info text-white" *ngIf="cartItems.length === 0">
    Your cart is empty.
  </div>

  <button class="btn btn-outline-primary d-flex align-items-center mb-3" (click)="goBack()">
    <i class="bi bi-arrow-left me-2"></i>
    <span>Back</span>
  </button>

  <div *ngIf="cartItems.length > 0">
    <div class="row gx-0 border rounded-3 mb-3 p-3 align-items-center" *ngFor="let item of cartItems; let i = index">

      <div class="col-md-2 text-center">
        <img [src]="'/assets/images/' + item.product.imageUrl" [alt]="item.product.name" class="img-fluid rounded" style="max-height: 100px;">
      </div>

      <div class="col-md-4">
        <h5 class="mb-1">{{ item.product.brand }} - {{ item.product.name }}</h5>
        <p class="text-muted mb-1">{{ item.product.category }}</p>
        <p class="mb-0 text-danger fw-bold">{{ item.product.price | currency:'TRY' }}</p>
      </div>

      <div class="col-md-3 d-flex align-items-center justify-content-center">
        <button class="btn btn-outline-secondary btn-sm" (click)="decraseItemQuantity(item)" [disabled]="item.quantity === 1">
          <i class="bi bi-dash" style="color: black; font-weight: 900;"></i>
        </button>
        <input type="number" class="form-control mx-2 text-center" style="width: 60px;"
        [(ngModel)]="item.quantity"
        (change)="onQuantityInputChange(item, $event)"
        [min]="1"
        [max]="item.product.stockQuantity">
        <button class="btn btn-outline-secondary btn-sm" (click)="increaseItemQuantity(item)">
          <i class="bi bi-plus" style="color: black; font-weight: 900;"></i>
        </button>
      </div>

      <div class="col-md-2 text-center">
        <p class="mb-0 fw-bold">{{ item.product.price * item.quantity | currency:'TRY' }}</p>
      </div>

      <div class="col-md-1 text-center">
        <button class="btn btn-outline-danger btn-sm" (click)="removeItemFromCart(item)">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>

    <hr>

    <div class="d-flex justify-content-between align-items-center">
      <h4>Toplam: {{ getTotalPrice() | currency:'TRY' }}</h4>
      <button class="btn btn-danger" (click)="clearCart()">Sepeti Boşalt</button>
      <button class="btn btn-success" (click)="checkout()">Satın Al</button>
    </div>
  </div>
</div>
