<div *ngIf="reviews.length === 0">
  <p>No reviews yet.</p>
</div>

<div *ngFor="let r of reviews" class="card mb-2 p-3">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <strong>{{ r.user.username }}</strong>
    <span>
      <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
        <i class="fa" [ngClass]="i < r.rating ? 'fa-star text-warning' : 'fa-star-o text-muted'"></i>
      </ng-container>
    </span>
  </div>
  <p>{{ r.content }}</p>
</div>

<div class="d-flex justify-content-between mt-2">
  <button class="btn btn-sm btn-outline-primary" (click)="prevPage()" [disabled]="pageNumber === 0">Prev</button>
  <button class="btn btn-sm btn-outline-primary" (click)="nextPage()" [disabled]="(pageNumber + 1) * pageSize >= totalElement">Next</button>
</div>
