<div class="container mt-4" *ngIf="!loading && orders.length > 0">
  <h2>My Orders</h2>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Total</th>
        <th>Date</th>
        <th>Details</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.status }}</td>
        <td>{{ order.totalAmount | currency:'TRY' }}</td>
        <td>{{ order.createAt | date:'short' }}</td>
        <td>
          <a [routerLink]="['/order', order.id]" class="btn btn-sm btn-info">
            View
          </a>
        </td>
        <td>
          <button class="btn btn-sm btn-danger"
          (click)="cancelOrder(order.id)"
          [disabled]="order.status !== 'CONFIRMED' && order.status !== 'PENDING'">Cancel</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<div class="container mt-4" *ngIf="!loading && orders.length === 0">
  <p>You have no orders yet.</p>
</div>

<div class="container mt-4" *ngIf="loading">
  <p>Loading orders...</p>
</div>

<div class="container mt-4" *ngIf="error">
  <p class="text-danger">{{ error }}</p>
</div>
