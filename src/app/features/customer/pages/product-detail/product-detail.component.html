<div class="container mt-4" *ngIf="!loading && product">
  <div class="row g-4">
    <div class="col-md-5">
      <img
        [src]="'/assets/images/' + product.imageUrl"
        alt="{{product.name}}"
        class="img-fluid rounded shadow"
        style="max-height: 350px; object-fit: contain;"
      >
    </div>
    <div class="col-md-7 d-flex flex-column justify-content-between">
      <div>
        <h2 class="fw-bold">{{ product.name }}</h2>
        <p class="text-muted fs-5">{{ product.brand }}</p>

        <h5 class="text-primary">{{ product.category }}</h5>

        <div *ngIf="product.stockQuantity > 0; else outOfStock">
          <p class="text-success fs-4 fw-bold">{{ product.price | currency:'TRY' }}</p>
        </div>
        <ng-template #outOfStock>
          <p class="text-danger fw-bold fs-5">Out of stock</p>
        </ng-template>

        <p class="mt-3">{{ product.description }}</p>

        <div class="d-flex align-items-center mt-3">
          <a [routerLink]="['/seller', product.seller.id]" class="d-flex align-items-center text-decoration-none">
            <img [src]="'https://ui-avatars.com/api/?name=' + product.seller.username + '&size=40&background=random&color=fff'"
            alt="{{ product.seller.username }}"
            class="rounded-circle me-2"
            >
            <span class="fw-bold">{{ product.seller.username }}</span>
          </a>
        </div>

        <div class="mt-3" *ngIf="averageRatings[product.id] !== undefined">
          <ng-container *ngFor="let star of [1,2,3,4,5]; let i = index">
            <i class="fa" [ngClass]="i < averageRatings[product.id] ? 'fa-star text-warning' : 'fa-star-o text-muted'"></i>
          </ng-container>
          <span class="ms-2">{{ averageRatings[product.id] | number:'1.1-1' }}</span>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button
          class="btn btn-primary flex-grow-1"
          [disabled]="product.stockQuantity === 0"
          (click)="addToCart(product)"
        >
          Add To Cart
        </button>
        <button
          class="btn btn-outline-danger flex-grow-1"
          (click)="backToProdcuts()"
        >
          Back
        </button>
      </div>
    </div>
  </div>

  <hr class="my-4">

  <h4>Reviews</h4>
  <app-review-list [productId]="product.id" [pageSize]="5"></app-review-list>
</div>

<div *ngIf="loading">
  <p>Loading product details...</p>
</div>
