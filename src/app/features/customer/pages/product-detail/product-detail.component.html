<div class="container mt-4" *ngIf="!loading && product">
  <div class="row g-4">
    <div class="col-md-5">
      <img
        [src]="'/assets/images/' + product.imageUrl"
        alt="{{product.name}}"
        class="img-fluid rounded shadow"
        style="max-height: 350px; object-fit: contain;"
      >
    </div>
    <div class="col-md-7 d-flex flex-column justify-content-between">
      <div>
        <h2 class="fw-bold">{{ product.name }}</h2>
        <p class="text-muted fs-5">{{ product.brand }}</p>

        <h5 class="text-primary">{{ product.category }}</h5>

        <div *ngIf="product.stockQuantity > 0; else outOfStock">
          <p class="text-success fs-4 fw-bold">{{ product.price | currency:'TRY' }}</p>
        </div>
        <ng-template #outOfStock>
          <p class="text-danger fw-bold fs-5">Out of stock</p>
        </ng-template>

        <p class="mt-3">{{ product.description }}</p>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button
          class="btn btn-primary flex-grow-1"
          [disabled]="product.stockQuantity === 0"
          (click)="addToCart(product)"
        >
          Add To Cart
        </button>
        <button
          class="btn btn-outline-danger flex-grow-1"
          (click)="backToProdcuts()"
        >
          Back
        </button>
      </div>
    </div>
  </div>
</div>
