<nav class="d-flex align-items-center p-2">
  <a routerLink="/" class="btn btn-sm btn-primary">Home</a>

  <div class="ms-auto">
    <ng-container *ngIf="!isLoggedIn; else loggedIn">
      <a routerLink="/login" class="btn btn-sm btn-success me-2">Login</a>
      <a routerLink="/register" class="btn btn-sm btn-warning">SingUp</a>
    </ng-container>
  </div>

  <ng-template #loggedIn>
    <span>Welcome {{ getCurrentUsername() }}</span>
    <a (click)="logout()" style="cursor: pointer;" class="btn btn-sm btn-danger">Logout</a>
  </ng-template>
</nav>

<router-outlet></router-outlet>
