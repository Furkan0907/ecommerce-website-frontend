<div class="d-flex justify-content-center align-items-start" style="min-height: 100vh; padding-top: 100px;">

  <div class="card p-4 shadow-lg" style="width: 400px; border-radius: 10px;">

    <h2 class="text-center fw-bold mb-4">LOGIN</h2>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Username:</label>
          <input type="text" class="bg-warning" formControlName="username" placeholder="Username">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password:</label>
          <input type="password" class="bg-warning" formControlName="password" placeholder="Password">
        </div>

        <div>
          <a class="forgot-password-link" (click)="forgotPassword()">Forgot Password?</a>
        </div>

        <p *ngIf="errorMessage" class="text-danger small mb-3">{{ errorMessage }}</p>

        <div class="text-end">
          <button type="submit" class="btn btn-success px-4 " [disabled]="loginForm.invalid">Login</button>
        </div>
    </form>
  </div>
</div>
