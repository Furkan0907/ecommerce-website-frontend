<div class="forgot-password-container p-3 mx-auto" style="max-width: 400px; border: 1px solid #007bff; border-radius: 8px; background-color: #f0f8ff;">
  <h3 class="text-center mb-3">Forgot Password</h3>

  <div *ngIf="successMessage" class="alert alert-success">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <button (click)="goBack()" class="btn btn-primary text-white btn-sm mb-3">← Back</button>

  <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" type="email" formControlName="email" class="form-control" placeholder="Enter your email">
      <div *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.invalid" class="text-danger">
        Please enter a valid email.
      </div>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">New Password</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" class="form-control">
        <i class="fa fa-eye password-toggle" [ngClass]="{ 'fa-eye': !showPassword, 'fa-eye-slash': showPassword }" (click)="togglePassword()"></i>
      </div>
      <div *ngIf="forgotPasswordForm.get('password')?.touched && forgotPasswordForm.get('password')?.invalid" class="text-danger">
        Password must be at least 6 character.
      </div>
    </div>

    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm Password</label>
      <div class="password-wrapper">
        <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword" class="form-control">
        <i class="fa password-toggle"
        [ngClass]="{ 'fa-eye': !showConfirmPassword, 'fa-eye-slash': showConfirmPassword }" (click)="toggleConfirmPassword()"></i>
      </div>
      <div *ngIf="forgotPasswordForm.hasError('passwordMismatch') && forgotPasswordForm.get('confirmPassword')?.touched" class="text-danger">
        Passwords must be match.
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="!forgotPasswordForm.valid">Reset Password</button>
  </form>
</div>
